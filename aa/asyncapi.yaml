asyncapi: 2.6.0
info:
  title: idmMw Kafka API
  version: 0.1.0
  description: >
    Kafka contracts for idmMw async processing. Topic names match
    aa/information-model.md and aa/kafka-access-map.md.
servers:
  productionKafka:
    url: kafka-1.example.local:9093,kafka-2.example.local:9093,kafka-3.example.local:9093
    protocol: kafka-secure
    description: Production placeholder from committed env examples.
channels:
  idm.events.in:
    description: "Flow IF-004: async write input topic."
    publish:
      summary: idmMw dispatcher publishes write events for worker processing.
      operationId: publishAsyncWriteEvent
      message:
        $ref: "#/components/messages/ProcessingPayload"
    subscribe:
      summary: idmMw worker consumes write events in async mode.
      operationId: consumeAsyncWriteEvent
      message:
        $ref: "#/components/messages/ProcessingPayload"
  idm.events.out:
    description: "Flow IF-004: processing status topic."
    publish:
      summary: idmMw worker publishes success or failure status.
      operationId: publishProcessingStatus
      message:
        $ref: "#/components/messages/ProcessingStatus"
  idm.dlq.retry:
    description: "Flow IF-005: DLQ retry topic."
    publish:
      summary: Admin retry path publishes a DLQ retry request.
      operationId: publishDlqRetry
      message:
        $ref: "#/components/messages/DlqRetry"
    subscribe:
      summary: idmMw worker consumes DLQ retry requests.
      operationId: consumeDlqRetry
      message:
        $ref: "#/components/messages/DlqRetry"
components:
  messages:
    ProcessingPayload:
      name: ProcessingPayload
      title: Processing payload
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ProcessingPayload"
    ProcessingStatus:
      name: ProcessingStatus
      title: Processing status
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ProcessingStatus"
    DlqRetry:
      name: DlqRetry
      title: DLQ retry payload
      contentType: application/json
      payload:
        $ref: "#/components/schemas/DlqRetry"
  schemas:
    ProcessingPayload:
      type: object
      required: [eventId, operation, targetSystem, payload]
      properties:
        eventId:
          type: string
          description: Business event identifier.
        operation:
          type: string
          description: Avanpost-compatible operation name.
        targetSystem:
          type: string
          description: Connector routing key matching TargetSystem.name.
        payload:
          type: object
          properties:
            data:
              type: object
            params:
              type: object
            metadata:
              type: object
          additionalProperties: true
      additionalProperties: true
    ProcessingStatus:
      type: object
      required: [status, sourceTopic]
      properties:
        eventId:
          type: string
        operation:
          type: string
        targetSystem:
          type: string
        status:
          type: string
          enum: [success, failed]
        sourceTopic:
          type: string
        error:
          type: string
          description: Safe error summary without secret values.
    DlqRetry:
      allOf:
        - $ref: "#/components/schemas/ProcessingPayload"
        - type: object
          required: [dlqItemId]
          properties:
            dlqItemId:
              type: string
              description: DLQ item to retry.
  securitySchemes:
    kafkaTls:
      type: X509
      description: TLS configured by KAFKA_TLS_* environment variables.
    encryptedPayload:
      type: symmetricEncryption
      description: Payload encryption through ENCRYPTION_KAFKA_ENABLED or global ENCRYPTION_ENABLED.
