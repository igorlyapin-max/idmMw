asyncapi: 2.6.0
info:
  title: idmMw Kafka API
  version: 0.1.0
  description: >
    Kafka-контракты для async processing в idmMw. Имена topics совпадают с
    aa/information-model.md и aa/kafka-access-map.md.
servers:
  productionKafka:
    url: kafka-1.example.local:9093,kafka-2.example.local:9093,kafka-3.example.local:9093
    protocol: kafka-secure
    description: Production placeholder из committed env examples.
channels:
  idm.events.in:
    description: "Поток IF-004: topic входящих событий async write."
    publish:
      summary: idmMw dispatcher публикует события write для обработки worker.
      operationId: publishAsyncWriteEvent
      message:
        $ref: "#/components/messages/ProcessingPayload"
    subscribe:
      summary: idmMw worker потребляет события write в async mode.
      operationId: consumeAsyncWriteEvent
      message:
        $ref: "#/components/messages/ProcessingPayload"
  idm.events.out:
    description: "Поток IF-004: topic статусов обработки."
    publish:
      summary: idmMw worker публикует status успеха или отказа.
      operationId: publishProcessingStatus
      message:
        $ref: "#/components/messages/ProcessingStatus"
  idm.dlq.retry:
    description: "Поток IF-005: topic DLQ retry."
    publish:
      summary: Admin retry path публикует DLQ retry request.
      operationId: publishDlqRetry
      message:
        $ref: "#/components/messages/DlqRetry"
    subscribe:
      summary: idmMw worker потребляет DLQ retry requests.
      operationId: consumeDlqRetry
      message:
        $ref: "#/components/messages/DlqRetry"
components:
  messages:
    ProcessingPayload:
      name: ProcessingPayload
      title: Payload обработки
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ProcessingPayload"
    ProcessingStatus:
      name: ProcessingStatus
      title: Статус обработки
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ProcessingStatus"
    DlqRetry:
      name: DlqRetry
      title: Payload DLQ retry
      contentType: application/json
      payload:
        $ref: "#/components/schemas/DlqRetry"
  schemas:
    ProcessingPayload:
      type: object
      required: [eventId, operation, targetSystem, payload]
      properties:
        eventId:
          type: string
          description: Идентификатор business event.
        operation:
          type: string
          description: Имя Avanpost-compatible operation.
        targetSystem:
          type: string
          description: Routing key connector, совпадающий с TargetSystem.name.
        payload:
          type: object
          properties:
            data:
              type: object
            params:
              type: object
            metadata:
              type: object
          additionalProperties: true
      additionalProperties: true
    ProcessingStatus:
      type: object
      required: [status, sourceTopic]
      properties:
        eventId:
          type: string
        operation:
          type: string
        targetSystem:
          type: string
        status:
          type: string
          enum: [success, failed]
        sourceTopic:
          type: string
        error:
          type: string
          description: Безопасное error summary без secret values.
    DlqRetry:
      allOf:
        - $ref: "#/components/schemas/ProcessingPayload"
        - type: object
          required: [dlqItemId]
          properties:
            dlqItemId:
              type: string
              description: DLQ item для retry.
  securitySchemes:
    kafkaTls:
      type: X509
      description: TLS настраивается переменными окружения `KAFKA_TLS_*`.
    encryptedPayload:
      type: symmetricEncryption
      description: Payload encryption через `ENCRYPTION_KAFKA_ENABLED` или global `ENCRYPTION_ENABLED`.
