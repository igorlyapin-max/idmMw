openapi: 3.0.3
info:
  title: idmMw HTTP API
  version: 0.1.0
  description: >
    HTTP-контракты idmMw, которыми владеет репозиторий. Идентификаторы потоков
    совпадают с aa/information-model.md.
servers:
  - url: http://localhost:3010
    description: Локальный/default HTTP listener
  - url: https://localhost:3010
    description: Локальный/default HTTPS listener при HTTP_TLS_ENABLED=true
tags:
  - name: Health
  - name: IDM Webhook
  - name: IDM Facade
  - name: Admin
  - name: Auth
  - name: Metrics
paths:
  /health:
    get:
      tags: [Health]
      summary: Проверка liveness и build identity
      description: "Поток: IF-009"
      responses:
        "200":
          description: Процесс обслуживает запросы.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /about:
    get:
      tags: [Health]
      summary: Безопасная build identity
      description: "Поток: IF-009"
      responses:
        "200":
          description: Build identity сервиса.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutResponse"
  /ready:
    get:
      tags: [Health]
      summary: Readiness зависимостей
      description: "Поток: IF-009"
      responses:
        "200":
          description: Зависимости готовы.
          content:
            application/json:
              schema:
                type: object
        "503":
          description: Одна или несколько зависимостей не готовы.
  /metrics:
    get:
      tags: [Metrics]
      summary: Метрики Prometheus
      description: "Поток: IF-010. Защищено integration auth при METRICS_PUBLIC_ENABLED=false."
      security:
        - integrationHmac: []
        - {}
      responses:
        "200":
          description: Текстовая экспозиция Prometheus.
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Требуется authentication согласно deployment policy.
  /webhooks/avanpost:
    post:
      tags: [IDM Webhook]
      summary: Прием Avanpost-compatible event
      description: "Поток: IF-001"
      security:
        - integrationHmac: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvanpostWebhook"
      responses:
        "201":
          description: Событие принято и обработано или поставлено в очередь.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResult"
        "400":
          description: Некорректный payload или ошибка чтения connector.
        "404":
          description: Целевая система не найдена.
        "500":
          description: Ошибка обработки.
  /idm/target-systems:
    get:
      tags: [IDM Facade]
      summary: Список enabled target systems для IDM
      description: "Поток: IF-002. Не возвращает connector config или secrets."
      security:
        - integrationHmac: []
        - {}
      responses:
        "200":
          description: Каталог включенных target systems.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdmTargetSystem"
  /idm/target-systems/{name}:
    get:
      tags: [IDM Facade]
      summary: Получить одну запись target system catalog
      description: "Поток: IF-002"
      security:
        - integrationHmac: []
        - {}
      parameters:
        - $ref: "#/components/parameters/TargetSystemName"
      responses:
        "200":
          description: Запись catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdmTargetSystem"
        "404":
          description: Целевая система не найдена или отключена.
  /idm/{targetSystem}/test:
    get:
      tags: [IDM Facade]
      summary: Проверить соединение с target system
      description: "Поток: IF-002"
      security:
        - integrationHmac: []
        - {}
      parameters:
        - $ref: "#/components/parameters/TargetSystem"
      responses:
        "200":
          description: Результат проверки в формате connector.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Connector завершился ошибкой.
        "404":
          description: Целевая система не найдена.
  /idm/{targetSystem}/users:
    get:
      tags: [IDM Facade]
      summary: Поиск users
      description: "Поток: IF-002"
      security:
        - integrationHmac: []
        - {}
      parameters:
        - $ref: "#/components/parameters/TargetSystem"
        - name: filter
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: Список users в формате connector.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Некорректный limit или ошибка connector.
  /idm/{targetSystem}/users/resolve:
    get:
      tags: [IDM Facade]
      summary: Найти user по username, login или filter
      description: "Поток: IF-002"
      security:
        - integrationHmac: []
        - {}
      parameters:
        - $ref: "#/components/parameters/TargetSystem"
        - name: username
          in: query
          schema:
            type: string
        - name: login
          in: query
          schema:
            type: string
        - name: filter
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Результат разрешения user в формате connector.
          content:
            application/json:
              schema:
                type: object
  /idm/{targetSystem}/users/{id}:
    get:
      tags: [IDM Facade]
      summary: Получить user по id
      description: "Поток: IF-002"
      security:
        - integrationHmac: []
        - {}
      parameters:
        - $ref: "#/components/parameters/TargetSystem"
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Результат user в формате connector.
          content:
            application/json:
              schema:
                type: object
  /idm/{targetSystem}/groups:
    get:
      tags: [IDM Facade]
      summary: Поиск groups
      description: "Поток: IF-002"
      security:
        - integrationHmac: []
        - {}
      parameters:
        - $ref: "#/components/parameters/TargetSystem"
        - name: filter
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: Список groups в формате connector.
          content:
            application/json:
              schema:
                type: object
  /idm/{targetSystem}/groups/{id}:
    get:
      tags: [IDM Facade]
      summary: Получить group по id
      description: "Поток: IF-002"
      security:
        - integrationHmac: []
        - {}
      parameters:
        - $ref: "#/components/parameters/TargetSystem"
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Результат group в формате connector.
          content:
            application/json:
              schema:
                type: object
  /idm/{targetSystem}/schema:
    get:
      tags: [IDM Facade]
      summary: Получить connector schema
      description: "Поток: IF-002"
      security:
        - integrationHmac: []
        - {}
      parameters:
        - $ref: "#/components/parameters/TargetSystem"
      responses:
        "200":
          description: Schema в формате connector.
          content:
            application/json:
              schema:
                type: object
  /idm/{targetSystem}/sync:
    post:
      tags: [IDM Facade]
      summary: Запустить connector sync
      description: "Поток: IF-002"
      security:
        - integrationHmac: []
        - {}
      parameters:
        - $ref: "#/components/parameters/TargetSystem"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [full, incremental]
      responses:
        "200":
          description: Результат sync в формате connector.
          content:
            application/json:
              schema:
                type: object
  /auth/session:
    get:
      tags: [Auth]
      summary: Текущий статус admin session
      description: "Поток: IF-003"
      responses:
        "200":
          description: Статус session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
  /auth/login:
    post:
      tags: [Auth]
      summary: Локальный admin login
      description: "Поток: IF-003"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "201":
          description: Статус session после попытки login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
  /auth/sso-login:
    post:
      tags: [Auth]
      summary: SSO admin login через trusted proxy headers
      description: "Поток: IF-003"
      responses:
        "201":
          description: Статус session после попытки SSO login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout текущей admin session
      description: "Поток: IF-003"
      responses:
        "201":
          description: Результат logout.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    enum: [true]
  /admin/stats:
    get:
      tags: [Admin]
      summary: Операционная сводка Admin
      description: "Поток: IF-003"
      security:
        - adminSession: []
      responses:
        "200":
          description: Сводка DLQ и runtime.
          content:
            application/json:
              schema:
                type: object
  /admin/dlq:
    get:
      tags: [Admin]
      summary: Список DLQ items
      description: "Поток: IF-003"
      security:
        - adminSession: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: targetSystem
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Страница DLQ.
          content:
            application/json:
              schema:
                type: object
  /admin/dlq/retry:
    post:
      tags: [Admin]
      summary: Повторная обработка нескольких DLQ items
      description: "Поток: IF-003"
      security:
        - adminSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                targetSystem:
                  type: string
                status:
                  type: string
                limit:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: Сводка retry.
          content:
            application/json:
              schema:
                type: object
  /admin/dlq/{id}/retry:
    post:
      tags: [Admin]
      summary: Повторная обработка одного DLQ item
      description: "Поток: IF-003"
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "201":
          description: Повторная обработка принята.
  /admin/dlq/{id}/skip:
    post:
      tags: [Admin]
      summary: Пропустить один DLQ item
      description: "Поток: IF-003"
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "201":
          description: Item помечен как skipped.
  /admin/target-systems:
    get:
      tags: [Admin]
      summary: Список target systems
      description: "Поток: IF-003"
      security:
        - adminSession: []
      responses:
        "200":
          description: Страница target system.
          content:
            application/json:
              schema:
                type: object
    post:
      tags: [Admin]
      summary: Создать target system
      description: "Поток: IF-003. Request может содержать connector config; secret values нельзя логировать или раскрывать."
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetSystemWrite"
      responses:
        "201":
          description: Созданная target system.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetSystem"
  /admin/target-systems/{id}:
    get:
      tags: [Admin]
      summary: Получить target system по id
      description: "Поток: IF-003"
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Целевая система.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetSystem"
    patch:
      tags: [Admin]
      summary: Обновить target system
      description: "Поток: IF-003"
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetSystemWrite"
      responses:
        "200":
          description: Обновленная target system.
    delete:
      tags: [Admin]
      summary: Удалить target system
      description: "Поток: IF-003"
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Результат удаления.
  /admin/target-systems/name/{name}:
    get:
      tags: [Admin]
      summary: Получить target system по name
      description: "Поток: IF-003"
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/TargetSystemName"
      responses:
        "200":
          description: Целевая система.
  /admin/target-systems/{id}/test:
    post:
      tags: [Admin]
      summary: Проверить соединение с target system
      description: "Потоки: IF-003 и IF-006"
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Результат проверки в формате connector.
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: idmmw_admin_session
    integrationHmac:
      type: apiKey
      in: header
      name: x-idmmw-signature
      description: HMAC header конкретного deployment при INTEGRATION_AUTH_ENABLED=true.
  parameters:
    TargetSystem:
      name: targetSystem
      in: path
      required: true
      schema:
        type: string
    TargetSystemName:
      name: name
      in: path
      required: true
      schema:
        type: string
    EntityId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    BuildIdentity:
      type: object
      required: [name, version, gitRevision, sourceClean, provenance, runtimeArtifactSha256]
      properties:
        name:
          type: string
          example: idmMw
        version:
          type: string
        gitRevision:
          type: string
        sourceClean:
          type: boolean
        provenance:
          type: string
          enum: [verified, unverified-local, unknown]
        runtimeArtifactSha256:
          type: string
    HealthResponse:
      type: object
      required: [status, build]
      properties:
        status:
          type: string
          enum: [ok]
        build:
          $ref: "#/components/schemas/BuildIdentity"
    AboutResponse:
      type: object
      required: [name, build]
      properties:
        name:
          type: string
          enum: [idmMw]
        build:
          $ref: "#/components/schemas/BuildIdentity"
    AvanpostWebhook:
      type: object
      required: [eventId, operation, targetSystem, payload]
      properties:
        eventId:
          type: string
        operation:
          type: string
        targetSystem:
          type: string
        payload:
          type: object
          properties:
            data:
              type: object
            params:
              type: object
            metadata:
              type: object
          additionalProperties: true
    WebhookResult:
      type: object
      required: [received, processed]
      properties:
        received:
          type: boolean
        processed:
          type: boolean
        data:
          nullable: true
    IdmTargetSystem:
      type: object
      required: [name, type, enabled, operations, readOperations, writeOperations, capabilities, operationStatus]
      properties:
        name:
          type: string
        type:
          type: string
        label:
          type: string
          nullable: true
        enabled:
          type: boolean
        operations:
          type: array
          items:
            type: string
        readOperations:
          type: array
          items:
            type: string
        writeOperations:
          type: array
          items:
            type: string
        capabilities:
          type: object
        operationStatus:
          type: object
        partialOperations:
          type: object
          additionalProperties:
            type: string
    TargetSystemWrite:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        label:
          type: string
        enabled:
          type: boolean
        config:
          type: object
          description: Connector configuration. Может содержать secret references или encrypted values.
    TargetSystem:
      allOf:
        - $ref: "#/components/schemas/TargetSystemWrite"
        - type: object
          properties:
            id:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    SessionStatus:
      type: object
      properties:
        authenticated:
          type: boolean
        username:
          type: string
        mode:
          type: string
